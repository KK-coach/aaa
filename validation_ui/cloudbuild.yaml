# AAA-204 S3 — build config for the aaa-admin image (validation_ui/Dockerfile
# with repo-root context). Run from the repo root:
#   gcloud builds submit . --config validation_ui/cloudbuild.yaml
# The source upload obeys .gcloudignore (no .env / .git / credentials).
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - validation_ui/Dockerfile
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
# NOTE: no nested substitution in defaults (Cloud Build doesn't expand
# ${PROJECT_ID} inside a substitution value) — the project id is literal.
substitutions:
  _IMAGE: europe-west3-docker.pkg.dev/project-7d6eedd4-adff-46ae-8fc/cloud-run-source-deploy/aaa-admin:latest
